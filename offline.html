<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sin conexión - AppJoteca</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f0f0f;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .box {
      max-width: 400px;
    }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 12px;
    }
    p {
      color: #aaa;
      line-height: 1.5;
    }
    button {
      margin-top: 24px;
      padding: 12px 28px;
      background: #1a1a2e;
      color: white;
      border: 1px solid #333;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Sin conexión</h1>
    <p>No hay internet en este momento. Algunas páginas pueden no estar disponibles, pero puedes seguir viendo el contenido que ya visitaste.</p>
    <button onclick="window.location.reload()">Reintentar</button>
  </div>
</body>
</html>
